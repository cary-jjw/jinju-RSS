name: shuffle-quote

on:
  # 唯一在这个仓库实测排上过队的表达式：每小时第 7 分（UTC）
  # 不用逗号枚举、不用 */5 —— 那两种在你们仓库 0 次触发
  schedule:
    - cron: '7 * * * *'
  # 手动按钮必须保留，随时能点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抽一条并推送
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          python3 生成feed.py
          git add feed.xml
          git diff --quiet --cached || (git commit -m "chore: shuffle quote" && git push)
