# 覆盖路径：.github/workflows/shuffle.yml
# 纯 GitHub 自动方案：用「触发机会密度」对抗 GitHub schedule 的丢跑
# 不需要 Cloudflare、不需要 PAT、不需要外部服务、不需要手动点按钮

name: shuffle-quote

on:
  schedule:
    # 每小时 12 个错峰刻度：:02 :07 :12 ... :57
    # 避开 :00/:05/:10 这类整点高峰（GitHub 官方明示这些时段最容易延迟或丢跑）
    # 实测本仓库 schedule 触发率约 20~30%，12 次机会 ≈ 每小时能中 2~3 次
    - cron: '2-57/5 * * * *'
  # 保留手动按钮（保底用，正常不用点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 每次触发只换一句、12 秒结束。
      # 短 job 每次重新 checkout 最新 main，不会像旧版 55 分钟长循环那样 push 冲突。
      - name: 抽一条并推送
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          python3 生成feed.py
          git add feed.xml
          git diff --quiet --cached || (git commit -m "chore: shuffle quote" && git push)

