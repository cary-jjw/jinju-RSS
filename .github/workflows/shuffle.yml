name: shuffle-quote
on:
  schedule:
    # 每小时 12 个错峰刻度，避开整点高峰；每个刻度是独立触发机会
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shuffle-quote
  cancel-in-progress: false      # 排队，不取消；短 job 不会堆积
jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          python3 生成feed.py
          git add feed.xml
          git diff --quiet --cached || (git commit -m "chore: shuffle quote" && git push)
