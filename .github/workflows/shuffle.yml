# 覆盖路径：.github/workflows/shuffle.yml
# 每小时 2 次（:07 / :37），每次只换一句，无 sleep 长循环
name: shuffle-quote
on:
  schedule:
    # 逗号=枚举：每小时第 7 分、第 37 分各一次，间隔 30 分钟，避开 :00/:30 高峰
    - cron: '7,37 * * * *'
  # 保留手动按钮，想立刻换一句随时可点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抽一条并推送
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          python3 生成feed.py
          git add feed.xml
          git diff --quiet --cached || (git commit -m "chore: shuffle quote" && git push)
